name: Update news & deploy

on:
  schedule:
    - cron: "17 */3 * * *"   # каждые 3 часа (UTC)
  workflow_dispatch:          # ручной запуск из вкладки Actions
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Если код сломан, сборка останавливается здесь: на сайте остаётся последняя рабочая версия.
      - name: Tests
        run: python -m unittest discover -s tests

      - name: Fetch news
        run: python scripts/fetch_news.py

      # Главное и обзоры недели — в Telegram. Без секретов шаг ничего не делает.
      - name: Post to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_post.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/news.json
          if [ -f state/telegram.json ]; then git add state/telegram.json; fi
          if git diff --cached --quiet; then
            echo "Нет изменений"
          else
            git commit -m "chore: update news $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          fi

      # Метка версии у app.js/styles.css: после обновления браузер сразу берёт новые файлы, а не старые из кэша.
      # Номер сборки в sw.js: новая версия сервис-воркера сбрасывает старый офлайн-кэш.
      - name: Cache-busting
        run: |
          sed -i -E "s/(app\.js|styles\.css)\"/\1?v=${GITHUB_SHA::7}\"/g" site/index.html
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/" site/sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
