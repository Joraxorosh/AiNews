<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI News</title>
  <meta name="description" content="Новости IT и ИИ: модели, инструменты, наука, безопасность — и база знаний.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><text x='16' y='22' font-size='16' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='white'>AI</text></svg>">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- Цвет системной полосы (Safari/Chrome на телефоне); app.js подстраивает его под выбранную на сайте тему. -->
  <meta name="theme-color" id="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-title" content="AI News">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Тема оформления применяется до отрисовки, чтобы страница не «мигала» стандартным видом.
    (function () {
      var FONTS = { paper: "https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" };
      var skin = null;
      try { skin = JSON.parse(localStorage.getItem("skin")); } catch (e) { /* приватный режим */ }
      // ?skin=paper в адресе — ссылка сразу на нужный вид (без сохранения выбора).
      var m = /[?&]skin=([a-z]+)/.exec(location.search);
      if (m && FONTS.hasOwnProperty(m[1]) || (m && m[1] === "default")) skin = m[1];
      window.__loadSkinFonts = function (name) {
        if (!FONTS[name] || document.getElementById("fonts-" + name)) return;
        var l = document.createElement("link");
        l.id = "fonts-" + name; l.rel = "stylesheet"; l.href = FONTS[name];
        document.head.appendChild(l);
      };
      if (skin && skin !== "default") { document.documentElement.dataset.skin = skin; window.__loadSkinFonts(skin); }
    })();
  </script>
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <a class="brand" href="#feed"><span class="logo">AI</span> News</a>
      <div class="top-meta">
        <span id="updated" class="muted"></span>
        <button id="theme-toggle" class="icon-btn" type="button" title="Сменить тему" aria-label="Сменить тему">◐</button>
      </div>
    </div>
    <div class="wrap edition" id="edition"></div>
    <nav class="wrap tabs" id="tabs" aria-label="Разделы">
      <a href="#feed" data-tab="feed">Лента</a>
      <a href="#digest" data-tab="digest">Дайджест</a>
      <a href="#models" data-tab="models">Модели ИИ</a>
      <a href="#tools" data-tab="tools">Инструменты</a>
      <a href="#science" data-tab="science">Наука</a>
      <a href="#it" data-tab="it">IT и безопасность</a>
      <a href="#saved" data-tab="saved">Избранное</a>
      <a href="#kb" data-tab="kb">База знаний</a>
      <a href="#themes" data-tab="themes">Оформление</a>
    </nav>
  </header>

  <main class="wrap">
    <!-- Новости -->
    <section id="news-view">
      <div class="filters">
        <input id="q" type="search" placeholder="Поиск по заголовкам и описаниям…  ( / )" autocomplete="off">
        <select id="period" aria-label="Период">
          <option value="1">24 часа</option>
          <option value="3">3 дня</option>
          <option value="7" selected>Неделя</option>
          <option value="30">Месяц</option>
          <option value="0">Всё время</option>
        </select>
        <select id="source" aria-label="Источник"><option value="">Все источники</option></select>
        <label class="check"><input type="checkbox" id="only-new"> только новое</label>
        <label class="check" title="Прочитанное — новости, которые вы открывали на этом устройстве"><input type="checkbox" id="hide-read"> скрыть прочитанное</label>
      </div>
      <div class="watch-row">
        <label for="watch" class="watch-label" title="Новости с этими словами подсвечиваются в ленте">Мои темы</label>
        <input id="watch" type="text" placeholder="через запятую: Claude Code, GigaChat, уязвимость" autocomplete="off">
        <label class="check"><input type="checkbox" id="only-watch"> только они</label>
      </div>
      <div id="tag-bar" class="tag-bar"></div>
      <p id="count" class="muted small"></p>
      <ol id="list" class="list"></ol>
      <button id="more" class="more" type="button" hidden>Показать ещё</button>
    </section>

    <!-- Дайджест -->
    <section id="digest-view" hidden>
      <div class="filters digest-bar">
        <div class="tag-bar" id="digest-period">
          <button class="chip" data-days="1" type="button">За сутки</button>
          <button class="chip" data-days="7" type="button">За неделю</button>
          <button class="chip" data-days="review" type="button">Обзор недели</button>
          <button class="chip" data-days="trends" type="button">Тренды</button>
        </div>
        <button id="digest-copy" class="chip" type="button" title="Скопировать дайджест как текст, чтобы переслать">Скопировать текстом</button>
      </div>
      <p id="digest-note" class="muted small"></p>
      <div id="digest-list"></div>
    </section>

    <!-- Оформление -->
    <section id="themes-view" hidden>
      <p class="muted small themes-note">Тема запоминается в этом браузере. Кнопка ◐ вверху переключает светлый и тёмный вариант в любой теме.</p>
      <div id="themes-list" class="themes-grid"></div>
    </section>

    <!-- База знаний -->
    <section id="kb-view" hidden>
      <div class="filters">
        <input id="kb-q" type="search" placeholder="Поиск по базе знаний…" autocomplete="off">
      </div>
      <div id="kb-sections" class="tag-bar"></div>
      <p id="kb-focus" class="small" hidden><a href="#kb">← Вся база знаний</a></p>
      <p id="kb-note" class="muted small"></p>
      <div id="kb-list" class="kb-grid"></div>
    </section>
  </main>

  <footer class="wrap foot">
    <details id="sources-status">
      <summary>Источники</summary>
      <ul id="sources-list"></ul>
    </details>
  </footer>

  <button id="to-top" class="to-top" type="button" title="Наверх" aria-label="Наверх" hidden>↑</button>
  <script src="app.js"></script>
</body>
</html>
